name: mba-hunter

on:
  schedule:
    # Recherche quotidienne vers 13h, heure de Paris. cron ne connaît que l'UTC et GitHub démarre les passages
    # planifiés avec parfois plusieurs heures de retard : on déclenche donc toutes les heures de 11h à 20h UTC,
    # et scripts/should_run.sh ne laisse passer que le premier déclenchement qui tombe à 13h Paris ou après,
    # tant que le run du jour n'a pas réussi.
    - cron: "7 11-20 * * *"
    # Boutons Telegram désactivés pour l'instant (telegram.buttons: false dans config.yaml).
    # Pour les réactiver, remettre ce passage, qui traite les clics (Telegram ne les garde que 24 h) :
    # - cron: "30 */4 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "Commande à lancer"
        type: choice
        options: [run, callbacks, list, forget, probe, test-telegram, chat-id]
        default: run
      target:
        description: "forget : ID(s) d'annonce séparés par des espaces (voir `list`), ou « all » ; probe : numéro d'une annonce eBay"
        type: string
        default: ""

permissions:
  contents: write            # pour recommiter la base SQLite

concurrency:
  group: mba-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Faut-il lancer le run du jour ? (passages planifiés seulement)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && ! scripts/should_run.sh; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.guard.outputs.skip != 'true'

      - name: Lancer mba-hunter
        if: steps.guard.outputs.skip != 'true'
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET: ${{ inputs.target }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CMD="${{ inputs.command }}"
          else
            CMD=run
            DAILY=--daily   # passage planifié : enregistre la date du jour une fois terminé
          fi
          if [ "$CMD" = "forget" ]; then
            if [ "$TARGET" = "all" ]; then
              python -m mba_hunter forget --all
            else
              # $TARGET volontairement sans guillemets : une liste d'IDs séparés par des espaces
              python -m mba_hunter forget $TARGET
            fi
          elif [ "$CMD" = "probe" ]; then
            python -m mba_hunter probe "$TARGET"
          else
            python -m mba_hunter "$CMD" ${DAILY:-}
          fi

      - name: Sauvegarder la base SQLite
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "mba-hunter[bot]"
          git config user.email "mba-hunter[bot]@users.noreply.github.com"
          [ -f data/mba_hunter.db ] && git add data/mba_hunter.db
          if git diff --cached --quiet; then
            echo "Base inchangée"
          else
            git commit -m "chore: mise à jour de la base [skip ci]"
            git push
          fi
