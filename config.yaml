# Configuration de mba-hunter.
# Les secrets (clés API, token Telegram) passent par des variables d'environnement, voir .env.example.

ebay:
  marketplace: EBAY_FR
  query: "MacBook M2"
  category_ids: "111422"        # « Macs portables » (Apple Notebooks) : écarte voitures miniatures M2 Machines, accessoires…
  buying_options: AUCTION       # enchères uniquement
  sort: endingSoonest
  delivery_country: FR          # annonces livrables dans ce pays ("" = pas de filtre)
  # Provenance des annonces. Sur EBAY_FR, la recherche par défaut ne remonte pas les annonces étrangères :
  # WORLDWIDE = « Monde entier » dans l'appli (autres valeurs : EUROPEAN_UNION, CONTINENTAL_EUROPE,
  # UK_AND_IRELAND, NORTH_AMERICA, ASIA, BORDER_COUNTRIES ; "" = désactivé).
  item_location_region: WORLDWIDE
  # Position de l'acheteur, recommandée par eBay avec WORLDWIDE (influence aussi l'estimation du port).
  buyer_location: "country=FR,zip=75001"
  # Alternative : un appel par pays de vendeur (codes ISO entre guillemets : sans eux, YAML lit NO comme « non »).
  # N'utiliser que si le filtre de région ne suffit pas. Exemple : ["DE", "IT", "ES", "BE", "NL"]
  item_location_countries: []

filters:
  max_price: 650                # EUR — plafond d'enchère
  include_shipping: false       # false : les frais de port ne comptent pas dans le plafond
  min_hours_left: 1             # ignore les enchères qui se terminent trop tôt pour agir
  # Expressions régulières, insensibles à la casse.
  required_patterns:
    - '\bm2\b'
  excluded_patterns:
    - '\bm1\b'
    - '\bm3\b'
    - '\bm4\b'
    - '\b15\s*(")?\s*(pouces|inch|")'
    - '\b15[,.]3'
    - '\bpi[eè]ces?\b'
    - '\bhs\b'
    - 'for parts'
    - 'pour pi[eè]ces'
    - '\bm2 machines\b'
    - '(diecast|miniature|1[:/]64|1[:/]24|1[:/]18)'
    - 'bo[iî]te vide'
    - '\b(coque|housse|chargeur seul|clavier seul)\b'

claude:
  model: claude-opus-5-5
  effort: medium                # low | medium | high | xhigh | max
  max_analyses_per_run: 25      # garde-fou sur le coût
  min_score_to_notify: 0        # 0 = le score est affiché mais ne bloque jamais l'envoi (mettre p. ex. 50 pour filtrer)

telegram:
  buttons: false                # true : ajoute les boutons Valider / Refuser sous chaque annonce (voir README)

database:
  path: data/mba_hunter.db
